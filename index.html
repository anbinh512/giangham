<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>giangham</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
<script>
/* =====================================================================
   ✏️  CHỈNH SỬA THIỆP TẠI ĐÂY — chỉ cần sửa phần chữ/số trong dấu "..."
   (muốn xuống dòng trong câu chữ thì dùng \n)
   ===================================================================== */
const CONFIG = {

  /* ───────── 1. MÀN BẮT ĐẦU (nền đen, chữ trắng) ───────── */
  pageTitle:  "giangham",   // tên hiện trên tab trình duyệt
  introTitle: "Món quà từ An Bình\n(người đzai số 1 thế giới)",   // dòng chữ to ở giữa màn hình
  introHint:  "chạm để tiếp tục", // dòng chữ nhỏ nhấp nháy bên dưới
  introBg:    "#000000",              // màu nền  (vd "#1a1a2e", "#000000")
  introColor: "#ffffff",              // màu chữ


  /* ───────── 2. ĐÔI MẮT + ĐẾM NGƯỢC & CHỮ CHẠY ───────── */
  countdown:   ["3", "2", "1"],                     // các số đếm ngược (thêm/bớt tùy ý)
  words:       ["HAPPY", "WOMAN'S DAY", "TO", "Giang"],  // các từ hiện lần lượt
  countdownMs: 900,                                 // mỗi số hiện bao lâu (1000 = 1 giây)
  wordMs:      800,                                 // mỗi từ hiện bao lâu
  eyeColor:    "#00e5ff",   // màu đôi mắt phát sáng (vd "#ff4fa3" = hồng, "#7CFF6B" = xanh lá)
  petalColor:  "#ff4f7b",   // màu những cánh hoa nhỏ bay lơ lửng ở nền
  petals:      true,        // false = tắt cánh hoa bay


  /* ───────── 3. MÀN ULTRAMAN ───────── */
  cakeTitle:   "♥ Happy Woman's Day ♥",   // dòng chữ phía trên Ultraman (nên ngắn)
  cakeSeconds: 3.8,                    // màn này hiện bao nhiêu giây


  /* ───────── 4. BÌA THIỆP ───────── */
  // Tên ảnh trong kho ASSETS (cuối file), hoặc đường dẫn file như "anh-bia.jpg"
  cover:     "cover",
  coverHint: "chạm vào thiệp để mở ♥",


  /* ───────── 5. CÁC TRANG TRONG SÁCH ───────── */
  barText: "chạm để lật trang=))",   // dòng nhắc phía trên cuốn sách

  // Mỗi mục { left:..., right:... } = 1 lần mở sách (trang trái + trang phải).
  // Muốn thêm trang: copy 1 mục rồi dán thêm vào (nhớ có dấu phẩy ở cuối).
  // Mỗi trang có thể là một trong 4 loại:
  //   {text:"Dòng 1\nDòng 2"}                      → chữ (\n = xuống dòng)
  //   {photo:"photo1"}                              → ảnh (tên trong ASSETS hoặc đường dẫn file)
  //   {photo:"photo1", caption:"Chú thích ảnh"}     → ảnh có chú thích bên dưới
  //   {art:"hat"} {art:"cake"} {art:"bouquet"}      → hình vẽ có sẵn
  //   {envelope:"Chữ trên phong bì"}                → phong bì
  spreads: [
    { left: {photo:"photo1"},  right: {photo:"photo2"} },

    { left:  {text:"Chúc m 20/10\nthật vui, thật nhiều\nniềm vui và luôn\ntươi cười=))"},
      right: {text:"Chúc luôn chăm học\ntiến tới thành công\ntrong tương lai."} },

    { left:  {text:"Mong m có thể\nthành công vào được\nđại học mong muốn ✨"},
      right: {text:"Và vẫn luôn thông\nminh, học giỏi\nvà ít hỏi mấy câu\nhơi xàm=))."} },

    { left:  {art:"bouquet"},
      right: {envelope:"Còn một món quà\nnữa,\nmở tiếp đi=))"} }
  ],


  /* ───────── 6. HỘP QUÀ Ở CUỐI ───────── */
  giftHint:   "chạm vào để nhận quà 🎁",
  finalTitle: "Tặng m bó hoa🌹",
  finalWish:  "Chúc mừng ngày Phụ nữ!\nMong m sẽ rực rỡ như đóa hoa này,\nluôn xinh đẹp và ít gửi mấy chị trên tik cho tôi=)).",
  finalSign:  "— ngdzs1tg",
  replayText: "↻ bấm để coi lại",


  /* ───────── 7. NHẠC NỀN ───────── */
  // Tên trong kho ASSETS, hoặc đường dẫn như "nhac.mp3". Để "" nếu không muốn có nhạc.
  music:       "music",
  musicVolume: 0.8,    // âm lượng từ 0 đến 1
  musicLoop:   true,   // true = lặp lại, false = phát một lần


  /* ───────── 8. MÀU SẮC CHỦ ĐẠO ───────── */
  colors: {
    main: "#ff4fa3",   // hồng đậm (chữ, hạt lấp lánh, mưa chữ)
    soft: "#ffd6e8",   // hồng nhạt (nền thanh nhắc, nút)
    rose: "#d91a3c",   // đỏ hồng (tiêu đề cuối)
    text: "#4a2a38"    // màu chữ trong sách
  }
};
/* ===================== HẾT PHẦN CHỈNH SỬA ===================== */
</script>
<style>
  :root{
    --pink:#ff4fa3; --pink-soft:#ffd6e8; --rose:#d91a3c; --ink:#4a2a38;
    --hand:'Itim','Segoe Print','Comic Sans MS',cursive;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#fff;overflow:hidden;touch-action:manipulation;font-family:var(--hand)}
  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:transparent;opacity:0;pointer-events:none;transition:opacity .7s ease;z-index:2;
    padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);cursor:pointer}
  .screen.on{opacity:1;pointer-events:auto}

  /* ===== Màn 0: nền đen chữ trắng ===== */
  #s0{background:#000;color:#fff;z-index:10;text-align:center;gap:22px}
  #s0 h1{font-size:clamp(28px,8vw,56px);font-weight:400;letter-spacing:1px}
  #s0 p{font-size:clamp(14px,3.6vw,20px);opacity:.75;animation:blink 1.6s ease-in-out infinite}
  @keyframes blink{50%{opacity:.2}}

  /* ===== Hạt lấp lánh nền trắng ===== */
  #sparkle{position:fixed;inset:0;z-index:1;pointer-events:none}
  #sparkle i{position:absolute;width:5px;height:5px;border-radius:50%;background:var(--pink);opacity:.2;animation:tw 3s ease-in-out infinite}
  @keyframes tw{50%{opacity:.85;transform:scale(1.6)}}

  /* ===== Màn 1: đôi mắt phát sáng + đếm ngược ===== */
  #s1{gap:clamp(22px,6vh,46px);overflow:hidden}
  #petals{position:absolute;inset:0;pointer-events:none;overflow:hidden}
  #petals i{position:absolute;top:-6vh;border-radius:60% 0 60% 0;opacity:0;animation:petalfall linear infinite}
  @keyframes petalfall{0%{transform:translate(0,0) rotate(0);opacity:0}10%{opacity:.85}90%{opacity:.6}
    100%{transform:translate(var(--sx,30px),112vh) rotate(380deg);opacity:0}}
  .eyes{position:absolute;left:0;right:0;bottom:calc(50% + clamp(34px,8vh,64px));display:flex;justify-content:center;
    gap:clamp(26px,9vw,64px);animation:look 5.5s ease-in-out 1s infinite}
  /* liếc trái – liếc phải */
  @keyframes look{0%,8%{transform:translateX(0)}20%,38%{transform:translateX(calc(-1 * clamp(12px,4vw,22px)))}
    50%,52%{transform:translateX(0)}64%,82%{transform:translateX(clamp(12px,4vw,22px))}94%,100%{transform:translateX(0)}}
  .eye{width:clamp(66px,23vw,118px);height:clamp(66px,23vw,118px);border-radius:28%;
    background:linear-gradient(180deg,#d6fdff 0%,var(--eye) 60%);
    box-shadow:0 0 8px var(--eye),0 0 22px color-mix(in srgb,var(--eye) 70%,transparent),0 0 48px color-mix(in srgb,var(--eye) 40%,transparent),inset 0 -6px 14px rgba(255,255,255,.25);
    animation:eyein .8s cubic-bezier(.2,1.5,.4,1) both,eyeblink 3.4s ease-in-out 1.2s infinite,eyeglow 2.4s ease-in-out infinite}
  @keyframes eyein{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes eyeblink{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
  @keyframes eyeglow{50%{filter:brightness(1.18)}}
  #big{position:relative;min-height:1.4em;font-family:"Courier New",ui-monospace,monospace;font-size:clamp(28px,9.5vw,60px);
    color:var(--pink);font-weight:700;letter-spacing:3px;text-align:center;
    text-shadow:0 0 0 #fff,2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,0 0 16px #fff}
  #big.pop{animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}

  /* ===== Màn 2: mèo ===== */
  #s2 svg{width:min(86vw,520px);height:auto;overflow:visible}
  .bob{animation:bob 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
  .bob2{animation-delay:.25s}
  @keyframes bob{50%{transform:translateY(-8px) rotate(2deg)}}

  /* ===== Màn 3: bìa thiệp ===== */
  .cover{width:min(48vw,230px);aspect-ratio:3/4;background:linear-gradient(160deg,#ffc2dd,#ff93c2);border-radius:14px;
    box-shadow:0 14px 34px rgba(255,79,163,.35);display:flex;align-items:center;justify-content:center;
    animation:float 2.2s ease-in-out infinite;position:relative}
  .cover{padding:7px}
  .cover img{width:100%;height:100%;object-fit:cover;border-radius:9px;display:block}
  @keyframes float{50%{transform:translateY(-10px)}}
  .tip{margin-top:26px;color:var(--pink);font-size:clamp(14px,3.8vw,20px);animation:blink 1.6s ease-in-out infinite}

  /* ===== Màn 4: sách lật trang ===== */
  #s4{gap:16px}
  .bar{width:min(92vw,640px);background:var(--pink-soft);color:var(--pink);border-radius:999px;padding:9px 18px;
    display:flex;justify-content:space-between;align-items:center;font-size:clamp(12px,3.4vw,17px);box-shadow:0 4px 14px rgba(255,79,163,.2)}
  .book{position:relative;width:min(92vw,640px);aspect-ratio:1.55/1;perspective:1800px;container-type:inline-size;
    filter:drop-shadow(0 16px 24px rgba(120,40,80,.28))}
  .page,.face{position:absolute;top:0;width:50%;height:100%;background:#fffafc;display:flex;align-items:center;justify-content:center;
    padding:5cqw;text-align:center;overflow:hidden;color:var(--ink);font-family:var(--hand);font-size:3.6cqw;line-height:1.45;white-space:pre-line}
  .page.left,.face.back{left:0;border-radius:10px 0 0 10px;background:linear-gradient(90deg,#fff6fa,#fffafc 85%,#f4dbe6)}
  .page.right,.face.front{left:50%;border-radius:0 10px 10px 0;background:linear-gradient(270deg,#fff6fa,#fffafc 85%,#f4dbe6)}
  .flip{position:absolute;top:0;right:0;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;display:none;z-index:5}
  .flip .face{left:0;width:100%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
  .flip .back{transform:rotateY(180deg)}
  .page svg{width:78%;height:auto;max-height:90%}
  .photo{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6cqw;max-width:100%;max-height:100%;height:100%}
  .ph{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 4px 12px rgba(120,40,80,.25)}
  .photo.hascap .ph{height:calc(100% - 7cqw);width:auto}
  .capt{font-size:3.2cqw;line-height:1.2;color:var(--pink);white-space:pre-line}
  .env{background:#e08a3c;color:#fff;border-radius:8px;padding:6cqw 4cqw;box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);font-size:3.4cqw;width:88%}

  /* ===== Màn 5: hộp quà ===== */
  #s5{gap:10px;text-align:center;padding-bottom:30px}
  #gift{width:min(58vw,260px);cursor:pointer;animation:wiggle 1.6s ease-in-out infinite;overflow:visible}
  @keyframes wiggle{0%,100%{transform:rotate(0)}10%{transform:rotate(-4deg)}20%{transform:rotate(4deg)}30%{transform:rotate(-3deg)}40%{transform:rotate(0)}}
  #lid{transition:transform .8s cubic-bezier(.3,1.4,.5,1),opacity .8s;transform-box:fill-box}
  #gift.open{animation:none}
  #gift.open #lid{transform:translateY(-140px) rotate(-25deg);opacity:0}
  #gift.gone{transition:opacity .6s,transform .6s;opacity:0;transform:scale(.6) translateY(40px);pointer-events:none;position:absolute}
  #reveal{display:none;flex-direction:column;align-items:center;gap:6px;max-width:min(92vw,520px)}
  #reveal.show{display:flex}
  #bouquet{width:min(64vw,300px);height:auto;animation:rise 1.2s cubic-bezier(.2,1.2,.4,1) both;filter:drop-shadow(0 10px 14px rgba(160,20,50,.25))}
  @keyframes rise{from{transform:translateY(80px) scale(.3);opacity:0}to{transform:none;opacity:1}}
  #reveal h2{font-size:clamp(22px,6.4vw,36px);color:var(--rose);font-weight:400;animation:fadeUp 1s .9s both}
  #reveal p{font-size:clamp(15px,4.2vw,21px);color:var(--ink);line-height:1.55;white-space:pre-line;animation:fadeUp 1s 1.4s both}
  #reveal .sign{color:var(--pink);font-size:clamp(16px,4.4vw,22px);animation:fadeUp 1s 2s both}
  #replay{margin-top:8px;border:0;background:var(--pink-soft);color:var(--pink);font-family:var(--hand);font-size:15px;padding:8px 18px;border-radius:999px;cursor:pointer;animation:fadeUp 1s 2.6s both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

  .petal{position:fixed;top:-30px;z-index:3;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}

  /* nút tắt/bật nhạc */
</style>
</head>
<body>

<!-- Hoa hồng dùng chung (vẽ bằng SVG, không cần ảnh) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="rose" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="44" fill="#b80f2c"/>
      <circle cx="50" cy="50" r="33" fill="#d91a3c"/>
      <path d="M50 14C74 16 90 36 84 58C78 80 52 90 34 80C16 70 14 44 30 30C42 20 62 24 66 38C70 52 56 62 46 56C38 51 40 42 48 42" fill="none" stroke="#7d0a1f" stroke-width="4" stroke-linecap="round"/>
      <path d="M22 36C30 18 54 12 70 22" fill="none" stroke="#ff7d97" stroke-width="4" stroke-linecap="round" opacity=".75"/>
    </symbol>
  </defs>
</svg>

<div id="sparkle"></div>

<!-- Màn 0 -->
<div class="screen on" id="s0">
  <h1 id="introTitle"></h1>
  <p id="introHint"></p>
</div>

<!-- Màn 1 -->
<div class="screen" id="s1">
  <div id="petals"></div>
  <div class="eyes"><div class="eye"></div><div class="eye"></div></div>
  <div id="big"></div>
</div>

<!-- Màn 2: mèo và bánh kem -->
<div class="screen" id="s2">
  <svg viewBox="0 0 320 240" aria-label="Nhân vật Ultraman">
    <ellipse cx="160" cy="226" rx="120" ry="10" fill="#ffe3a8"/>
    <rect x="40" y="206" width="240" height="18" rx="6" fill="#ffe9b8"/>
    <ellipse cx="160" cy="226" rx="90" ry="9" fill="#ffe3a8"/>
    <!-- Ultraman -->
    <g class="bob bob2">
      <!-- chân -->
      <path d="M134 176 L130 214 Q130 220 138 220 L156 220 L156 176Z" fill="#e8edf2" stroke="#444" stroke-width="3" stroke-linejoin="round"/>
      <path d="M186 176 L190 214 Q190 220 182 220 L164 220 L164 176Z" fill="#e8edf2" stroke="#444" stroke-width="3" stroke-linejoin="round"/>
      <path d="M134 176 L156 176 L156 196 L132 200Z" fill="#d91a3c" stroke="#444" stroke-width="3" stroke-linejoin="round"/>
      <path d="M186 176 L164 176 L164 196 L188 200Z" fill="#d91a3c" stroke="#444" stroke-width="3" stroke-linejoin="round"/>
      <!-- tay phải (hạ xuống, nắm) -->
      <path d="M200 112 Q226 128 222 158" fill="none" stroke="#444" stroke-width="17" stroke-linecap="round"/>
      <path d="M200 112 Q226 128 222 158" fill="none" stroke="#e8edf2" stroke-width="11" stroke-linecap="round"/>
      <circle cx="222" cy="162" r="9" fill="#d91a3c" stroke="#444" stroke-width="3"/>
      <!-- thân -->
      <path d="M116 112 Q160 98 204 112 L196 182 L124 182Z" fill="#e8edf2" stroke="#444" stroke-width="3" stroke-linejoin="round"/>
      <path d="M130 108 Q160 100 190 108 L184 178 L136 178 Q150 140 130 108Z" fill="#d91a3c"/>
      <path d="M130 108 Q160 100 190 108 L184 178 L136 178 Q124 140 130 108Z" fill="#d91a3c" stroke="#444" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M190 108 Q166 140 184 178" fill="none" stroke="#444" stroke-width="2.5"/>
      <path d="M130 108 Q154 140 136 178" fill="none" stroke="#444" stroke-width="2.5"/>
      <!-- đèn màu trên ngực -->
      <circle cx="160" cy="126" r="9" fill="#5ad7ff" stroke="#444" stroke-width="3"/>
      <circle cx="157" cy="123" r="3" fill="#fff"/>
      <!-- đai -->
      <rect x="124" y="170" width="72" height="9" rx="3" fill="#8f9aa6" stroke="#444" stroke-width="2.5"/>
      <!-- tay trái (vẫy chào) -->
      <path d="M120 112 Q90 100 96 66" fill="none" stroke="#444" stroke-width="17" stroke-linecap="round"/>
      <path d="M120 112 Q90 100 96 66" fill="none" stroke="#e8edf2" stroke-width="11" stroke-linecap="round"/>
      <circle cx="96" cy="60" r="9" fill="#d91a3c" stroke="#444" stroke-width="3"/>
      <!-- đầu -->
      <path d="M160 24 Q172 22 176 34 Q178 46 166 52 L160 52Z" fill="#d91a3c" stroke="#444" stroke-width="3" stroke-linejoin="round" transform="translate(0 2)"/>
      <ellipse cx="160" cy="76" rx="32" ry="36" fill="#e8edf2" stroke="#444" stroke-width="3"/>
      <path d="M160 42 Q170 30 160 22 Q150 30 160 42Z" fill="#c9d2da" stroke="#444" stroke-width="2.5" stroke-linejoin="round" opacity="0"/>
      <path d="M160 40 L160 108" stroke="#c0c9d2" stroke-width="3" opacity=".7"/>
      <!-- mắt -->
      <path d="M135 70 Q148 64 156 74 Q148 86 136 82 Q131 76 135 70Z" fill="#fff6b0" stroke="#444" stroke-width="3" stroke-linejoin="round"/>
      <path d="M185 70 Q172 64 164 74 Q172 86 184 82 Q189 76 185 70Z" fill="#fff6b0" stroke="#444" stroke-width="3" stroke-linejoin="round"/>
      <ellipse cx="146" cy="75" rx="3" ry="4" fill="#ffd34d"/><ellipse cx="174" cy="75" rx="3" ry="4" fill="#ffd34d"/>
      <!-- miệng + má -->
      <path d="M152 96 Q160 100 168 96" fill="none" stroke="#444" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="136" cy="92" r="5" fill="#ffb3d1" opacity=".85"/><circle cx="184" cy="92" r="5" fill="#ffb3d1" opacity=".85"/>
    </g>
    <!-- lấp lánh -->
    <path d="M70 100 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4Z" fill="#ffd34d"/>
    <path d="M250 70 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3Z" fill="#ff4fa3"/>
    <text id="cakeTitle" x="160" y="22" text-anchor="middle" font-family="Itim,cursive" font-size="22" fill="#ff4fa3">♥ Happy Woman's Day ♥</text>
  </svg>
</div>

<!-- Màn 3: bìa thiệp -->
<div class="screen" id="s3">
  <div class="cover" id="cover">
    <img id="coverImg" alt="Bìa thiệp">
  </div>
  <div class="tip" id="coverHint"></div>
</div>

<!-- Màn 4: sách -->
<div class="screen" id="s4">
  <div class="bar"><span id="barText"></span><span>♥</span></div>
  <div class="book" id="book">
    <div class="page left" id="L"></div>
    <div class="page right" id="R"></div>
    <div class="flip" id="F">
      <div class="face front" id="Ff"></div>
      <div class="face back" id="Fb"></div>
    </div>
  </div>
</div>

<!-- Màn 5: hộp quà -->
<div class="screen" id="s5">
  <svg id="gift" viewBox="0 0 200 200" aria-label="Hộp quà">
    <ellipse cx="100" cy="188" rx="80" ry="8" fill="#000" opacity=".1"/>
    <rect x="30" y="90" width="140" height="92" rx="6" fill="#ff6f9c"/>
    <rect x="88" y="90" width="24" height="92" fill="#ffe27a"/>
    <g id="lid">
      <rect x="22" y="64" width="156" height="34" rx="6" fill="#ff4f86"/>
      <rect x="88" y="64" width="24" height="34" fill="#ffd34d"/>
      <path d="M100 64 C70 24 40 40 62 60 C74 70 92 66 100 64Z" fill="#ffd34d" stroke="#e6b422" stroke-width="2"/>
      <path d="M100 64 C130 24 160 40 138 60 C126 70 108 66 100 64Z" fill="#ffd34d" stroke="#e6b422" stroke-width="2"/>

<script>
addEventListener('DOMContentLoaded', () => {
/* ---------- Hình minh hoạ cho các trang ---------- */
const ART = {
  hat: `<svg viewBox="0 0 120 130"><path d="M40 44 L60 8 L80 44Z" fill="#8f7bff" stroke="#444" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="60" cy="8" r="6" fill="#ffd34d" stroke="#444" stroke-width="2"/>
    <rect x="22" y="44" width="76" height="70" rx="18" fill="#fff" stroke="#444" stroke-width="3"/>
    <circle cx="46" cy="76" r="4" fill="#444"/><circle cx="74" cy="76" r="4" fill="#444"/>
    <path d="M50 92 q10 9 20 0" fill="none" stroke="#444" stroke-width="3" stroke-linecap="round"/>
    <circle cx="36" cy="88" r="6" fill="#ffb3d1"/><circle cx="84" cy="88" r="6" fill="#ffb3d1"/></svg>`,
  cake: `<svg viewBox="0 0 120 130"><rect x="58" y="14" width="5" height="26" fill="#ffd34d" stroke="#444" stroke-width="2"/>
    <path d="M60 4 q-6 8 0 12 q6 -4 0 -12Z" fill="#ff8a3d"/>
    <rect x="30" y="40" width="60" height="26" rx="6" fill="#ffd0e6" stroke="#444" stroke-width="3"/>
    <rect x="16" y="66" width="88" height="34" rx="8" fill="#ff9ec9" stroke="#444" stroke-width="3"/>
    <path d="M16 78 q10 10 20 0 t20 0 t20 0 t28 0" fill="none" stroke="#fff" stroke-width="4"/>
    <rect x="8" y="100" width="104" height="10" rx="4" fill="#ffe9b8" stroke="#444" stroke-width="3"/>
    <path d="M100 30 l8 -8 M108 42 l10 -2 M96 18 l2 -10" stroke="#444" stroke-width="3" stroke-linecap="round"/></svg>`,
  bouquet: `<svg viewBox="0 0 120 140">
    <path d="M60 120 L60 70 M60 120 L38 62 M60 120 L82 62" stroke="#2e8b57" stroke-width="4" stroke-linecap="round"/>
    <use href="#rose" x="42" y="22" width="36" height="36"/><use href="#rose" x="18" y="40" width="34" height="34"/>
    <use href="#rose" x="68" y="40" width="34" height="34"/><use href="#rose" x="42" y="48" width="36" height="36"/>
    <path d="M22 80 L98 80 L70 128 Q60 132 50 128Z" fill="#ffc2dd" stroke="#444" stroke-width="2"/></svg>`
};
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function pageHTML(p){
  if(!p) return "";
  if(p.photo){
    const cap = p.caption ? `<div class="capt">${esc(p.caption)}</div>` : "";
    return `<div class="photo${p.caption?' hascap':''}"><img class="ph" src="${asset(p.photo)}" alt="">${cap}</div>`;
  }
  if(p.art) return ART[p.art] || "";
  if(p.envelope) return `<div class="env">${esc(p.envelope)}</div>`;
  return `<div>${esc(p.text||"")}</div>`;
}

/* ---------- Tiện ích ---------- */
// Lấy ảnh/nhạc: nếu trùng tên trong kho ASSETS (cuối file) thì dùng, không thì coi như đường dẫn/URL
const asset = k => (typeof ASSETS !== 'undefined' && ASSETS[k]) || k || "";
const $ = id => document.getElementById(id);
const sleep = ms => new Promise(r => setTimeout(r, ms));
function show(id){ document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id)); }

/* ---------- Đổ chữ cấu hình ra giao diện ---------- */
document.title = CONFIG.pageTitle || CONFIG.introTitle;
$('introTitle').textContent = CONFIG.introTitle;
$('introHint').textContent  = CONFIG.introHint;
$('coverHint').textContent  = CONFIG.coverHint;
$('barText').textContent    = CONFIG.barText;
$('giftHint').textContent   = CONFIG.giftHint;
$('finalTitle').textContent = CONFIG.finalTitle;
$('finalWish').textContent  = CONFIG.finalWish;
$('finalSign').textContent  = CONFIG.finalSign;
$('replay').textContent     = CONFIG.replayText;
$('cakeTitle').textContent  = CONFIG.cakeTitle;

/* màu sắc */
const C = CONFIG.colors, rs = document.documentElement.style;
rs.setProperty('--pink', C.main); rs.setProperty('--pink-soft', C.soft);
rs.setProperty('--rose', C.rose); rs.setProperty('--eye', CONFIG.eyeColor); rs.setProperty('--ink', C.text);

/* màn bắt đầu */
$('s0').style.background = CONFIG.introBg;
$('s0').style.color      = CONFIG.introColor;

/* bìa thiệp */
$('coverImg').src = asset(CONFIG.cover);

/* ---------- Hạt lấp lánh ---------- */
(function(){
  const box = $('sparkle');
  for(let i=0;i<45;i++){
    const d = document.createElement('i');
    d.style.left = Math.random()*100+'%'; d.style.top = Math.random()*100+'%';
    d.style.animationDelay = (Math.random()*3)+'s';
    d.style.animationDuration = (2+Math.random()*3)+'s';
    box.appendChild(d);
  }
})();

/* ---------- Cánh hoa bay lơ lửng ở màn đôi mắt ---------- */
(function(){
  const box = $('petals');
  if(!CONFIG.petals) return;
  for(let i=0;i<34;i++){
    const d = document.createElement('i'), s = 4 + Math.random()*6;
    d.style.cssText = `left:${Math.random()*100}%;width:${s}px;height:${s*1.3}px;background:${CONFIG.petalColor};`+
      `animation-duration:${6+Math.random()*7}s;animation-delay:${-Math.random()*10}s;--sx:${(Math.random()*120-40)|0}px`;
    box.appendChild(d);
  }
})();
async function showBig(t, ms){
  const b = $('big'); b.textContent = t;
  b.classList.remove('pop'); void b.offsetWidth; b.classList.add('pop');
  await sleep(ms);
}

/* ---------- Nhạc ---------- */
const bgm = $('bgm');

/* ---------- Luồng chính ---------- */
let started = false;
$('s0').addEventListener('click', async () => {
  if(started) return; started = true;
  if(CONFIG.music){
    bgm.src = asset(CONFIG.music); bgm.loop = CONFIG.musicLoop; bgm.volume = CONFIG.musicVolume;
    bgm.play().catch(()=>{});
  }
  show('s1');
  await sleep(700);
  for(const n of CONFIG.countdown) await showBig(n, CONFIG.countdownMs);
  for(const w of CONFIG.words)     await showBig(w, CONFIG.wordMs);
  $('big').textContent = "";
  show('s2'); await sleep(CONFIG.cakeSeconds*1000);
  show('s3');
});

/* Chạm bìa thiệp -> mở sách */
$('s3').addEventListener('click', () => {
  si = 0; renderSpread(0); show('s4');
});

/* ---------- Sách lật trang ---------- */
const S = CONFIG.spreads, L=$('L'), R=$('R'), F=$('F'), Ff=$('Ff'), Fb=$('Fb');
let si = 0, busy = false;
function renderSpread(i){ L.innerHTML = pageHTML(S[i].left); R.innerHTML = pageHTML(S[i].right); }

$('s4').addEventListener('click', () => {
  if(busy) return;
  if(si >= S.length-1){ show('s5'); return; }       // hết sách -> hộp quà
  busy = true;
  const n = S[si+1];
  Ff.innerHTML = pageHTML(S[si].right);
  Fb.innerHTML = pageHTML(n.left);
  R.innerHTML  = pageHTML(n.right);
  F.style.display = 'block';
  F.style.transition = 'none'; F.style.transform = 'rotateY(0deg)';
  void F.offsetWidth;
  F.style.transition = 'transform .9s ease-in-out'; F.style.transform = 'rotateY(-180deg)';
  setTimeout(() => { L.innerHTML = pageHTML(n.left); F.style.display = 'none'; si++; busy = false; }, 920);
});

/* ---------- Hộp quà -> bó hồng ---------- */
let opened = false;
$('gift').addEventListener('click', async e => {
  e.stopPropagation(); if(opened) return; opened = true;
  const g = $('gift'); g.classList.add('open'); $('giftHint').style.display = 'none';
  await sleep(700);
  g.classList.add('gone');
  $('reveal').classList.add('show');
  petals(40);
});
$('s5').addEventListener('click', () => { if(opened) petals(14); });

function petals(n){
  const cols = ["#d91a3c","#ff4f86","#ff8fb8","#ffc2dd"];
  for(let i=0;i<n;i++){
    const p = document.createElement('div'); p.className = 'petal';
    const s = 8+Math.random()*10;
    p.style.cssText = `left:${Math.random()*100}vw;width:${s}px;height:${s*1.3}px;background:${cols[i%4]};
      border-radius:60% 0 60% 0;--dx:${(Math.random()*160-80)}px;--rot:${Math.random()*720}deg;
      animation-duration:${3+Math.random()*3.5}s;animation-delay:${Math.random()*1.2}s`;
    document.body.appendChild(p);
    setTimeout(() => p.remove(), 8500);
  }
}

$('replay').addEventListener('click', e => { e.stopPropagation(); location.reload(); });
});
</script>
